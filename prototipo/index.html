<title>Caixa Altos Sabores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Figtree:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: faixa laranja da marca com o logo e as abas, faixa xadrez (toalha de mesa) logo abaixo.
   Comandas em "cartões de comanda" quadrados à esquerda; a comanda aberta à direita como um bloco de pedido.
   Tema único e deliberado com as cores do logo (tela de caixa, sempre clara). */
:root {
  --brand: #C55412;        /* laranja do logo */
  --brand-dark: #8F3A0A;
  --brand-soft: #F6DCC8;
  --cream: #E5E1D8;        /* creme do logo */
  --paper: #FFFBF3;        /* papel da comanda */
  --bg: #F3EDE3;
  --ink: #2A1B12;
  --muted: #76614F;
  --line: #E2D6C6;
  --line-strong: #CDBBA5;
  --soft: #EFE6D9;
  --ok: #2D7A4B;
  --ok-soft: #E1F0E6;
  --warn: #A86A12;
  --warn-soft: #FBEFD6;
  --bad: #B0281F;
  --bad-soft: #FBE4E1;
  --c-bebida: #2F6E8C;
  --c-sobremesa: #B8476A;
  --c-outros: #6E7B33;
  --lcd: #2A1B12;
  --lcd-digit: #FFB45E;
  --display: "Londrina Solid", "Arial Black", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --digits: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #F2A65A; outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); font-weight: 900; letter-spacing: .01em; line-height: 1; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- topo ---------- */
.top { background: var(--brand); color: var(--cream); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-in { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 8px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1360px; margin: 0 auto; }
.logo { height: 62px; width: auto; display: block; margin-bottom: 8px; }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; align-self: flex-end; overflow-x: auto; scrollbar-width: none; }
.tab { background: transparent; border: 0; color: var(--cream); padding: 10px 16px 12px; border-radius: 10px 10px 0 0; font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .02em; line-height: 1; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { background: rgba(255,255,255,.12); }
.tab[aria-current="page"] { background: var(--cream); color: var(--brand-dark); }
.tab .kbd { font-family: var(--mono); font-size: 11px; background: rgba(0,0,0,.14); }
.tab[aria-current="page"] .kbd { background: rgba(143,58,10,.12); }
.status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; background: rgba(0,0,0,.16); padding: 7px 14px; border-radius: 999px; white-space: nowrap; margin-bottom: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #9BE3B4; box-shadow: 0 0 0 3px rgba(155,227,180,.25); }
.dot.off { background: #F4A79F; box-shadow: 0 0 0 3px rgba(244,167,159,.25); }
/* toalha xadrez */
.gingham { height: 14px; background-color: var(--cream);
  background-image: linear-gradient(90deg, rgba(197,84,18,.5) 50%, transparent 50%), linear-gradient(rgba(197,84,18,.5) 50%, transparent 50%);
  background-size: 14px 14px; }

.wrap { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1360px; margin: 0 auto; }
.banner { background: var(--warn-soft); border: 1.5px solid #EBCB8B; color: #5E400B; padding: 12px 16px; border-radius: var(--r); margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--brand-dark); }
.h3 { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1.05; color: var(--ink); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.muted { color: var(--muted); }

/* botões com sombra "carimbada" */
.btn { border: 2px solid var(--ink); background: var(--paper); padding: 10px 16px; border-radius: var(--r); font-weight: 800; display: inline-flex; align-items: center; gap: 8px; justify-content: center; box-shadow: 0 3px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:hover { background: #FFF3E3; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--brand); color: #FFF7EC; border-color: var(--brand-dark); box-shadow: 0 3px 0 var(--brand-dark); }
.btn.primary:hover { background: #B44C10; }
.btn.ok { background: var(--ok); border-color: #1D5533; color: #fff; box-shadow: 0 4px 0 #1D5533; }
.btn.ok:hover { background: #276C42; }
.btn.danger { color: var(--bad); border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.btn.flat { border-color: transparent; box-shadow: none; background: transparent; }
.btn.flat:hover { background: var(--soft); }
.btn.big { padding: 14px 20px; font-size: 19px; }
.btn.huge { padding: 16px 20px; font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: .02em; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.kbd { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.08); font-weight: 700; letter-spacing: 0; }
.btn.primary .kbd, .btn.ok .kbd { background: rgba(255,255,255,.22); }

.field { display: flex; flex-direction: column; gap: 5px; }
.input { border: 2px solid var(--line-strong); background: #fff; border-radius: var(--r); padding: 10px 12px; width: 100%; min-width: 0; }
.input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px rgba(197,84,18,.18); }
.input.big { font-size: 24px; font-weight: 800; padding: 10px 14px; }

.panel { background: var(--paper); border: 2px solid var(--line-strong); border-radius: var(--r); }
.pad { padding: 18px; }

/* ---------- comandas ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 14px; }
.newbar { display: flex; gap: 8px; }
.newbar .input { font-family: var(--display); font-weight: 900; font-size: 28px; padding: 6px 14px; }
.newbar .input::placeholder { font-family: var(--body); font-size: 18px; font-weight: 600; color: #A8927C; }
.seg { display: flex; background: var(--soft); border-radius: var(--r); padding: 4px; gap: 4px; border: 2px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 4px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 var(--line-strong), 0 0 0 1px var(--line-strong); }

/* cartão de comanda */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 14px; }
.cmd { position: relative; text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r); padding: 0; display: flex; flex-direction: column; overflow: hidden; aspect-ratio: 1 / 1.08; box-shadow: 0 3px 0 var(--ink); transition: transform .08s; }
.cmd:hover { transform: translateY(-2px); }
.cmd-top { background: var(--brand); color: var(--cream); font-family: var(--display); font-size: 15px; letter-spacing: .14em; padding: 6px 10px 5px; display: flex; justify-content: space-between; align-items: center; }
.cmd-top .hole { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.cmd .n { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .9; color: var(--ink); padding: 8px 10px 0; flex: 1; }
.cmd-foot { border-top: 2px dashed var(--line-strong); padding: 7px 10px 9px; display: flex; flex-direction: column; gap: 1px; }
.cmd-foot .t { font-weight: 800; font-size: 18px; }
.cmd-foot .meta { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.cmd[aria-selected="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand), 0 5px 0 3px var(--brand-dark); }
.cmd.done .cmd-top { background: #8A7663; }
.cmd.void .cmd-top { background: #A79A8C; }
.cmd.void .n, .cmd.void .t { color: #A79A8C; text-decoration: line-through; }
.stamp { position: absolute; right: 8px; top: 40px; font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: .08em; padding: 1px 8px; border: 2.5px solid currentColor; border-radius: 4px; transform: rotate(-9deg); background: rgba(255,251,243,.85); }
.stamp.ok { color: var(--ok); }
.stamp.bad { color: var(--bad); }
.stamp.warn { color: var(--warn); }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--paper); }

/* bloco de pedido */
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); display: flex; flex-direction: column; overflow: hidden; border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.d-head { background: var(--brand); color: var(--cream); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; flex-wrap: wrap; }
.d-head .lbl { font-family: var(--display); font-size: 16px; letter-spacing: .16em; opacity: .9; }
.d-head .big { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .9; }
.d-head .when { text-align: right; font-weight: 700; font-size: 14px; }
.d-head .stamp { position: static; display: inline-block; background: var(--paper); }
.d-sec { padding: 16px 18px; border-bottom: 2px dashed var(--line-strong); }

/* balança */
.scale { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.g-in { display: flex; align-items: center; border: 2px solid var(--ink); border-radius: var(--r); background: #fff; overflow: hidden; }
.g-in input { border: 0; outline: none; width: 100%; min-width: 0; font-family: var(--display); font-weight: 900; font-size: 40px; padding: 4px 12px; background: transparent; }
.g-in input::placeholder { color: #D4C3AE; }
.g-in span { font-family: var(--display); font-size: 22px; color: var(--muted); padding-right: 12px; }
.g-in:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(197,84,18,.2); }
.lcd { background: var(--lcd); color: var(--lcd-digit); border-radius: var(--r); padding: 10px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border: 2px solid #000; box-shadow: inset 0 0 0 3px #3D2A1E; }
.lcd small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #C9A27D; }
.lcd b { font-family: var(--digits); font-weight: 400; font-size: 30px; line-height: 1.1; display: block; text-shadow: 0 0 10px rgba(255,180,94,.35); white-space: nowrap; }
.lcd .tot b { color: #FFE2B8; }
.scale-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.scale-actions .hint { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

/* cardápio de itens (quadradinhos) */
.picker-top { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cat { border: 2px solid var(--line-strong); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.cat i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.cat[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.find { flex: 1; min-width: 160px; position: relative; }
.find svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.find .input { padding-left: 36px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tile { position: relative; text-align: left; background: #fff; border: 2px solid var(--line-strong); border-radius: var(--r); padding: 10px 10px 9px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; transition: transform .06s, border-color .1s; }
.tile:hover { border-color: var(--ink); transform: translateY(-1px); }
.tile:active { transform: translateY(1px); }
.tile .sq { width: 12px; height: 12px; border-radius: 2px; }
.tile-top { display: flex; align-items: center; gap: 6px; }
.tile .cod { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 700; }
.tile .nm { font-weight: 700; font-size: 14px; line-height: 1.2; }
.tile .pr { font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1; }
.tile .cnt { position: absolute; top: 6px; right: 6px; background: var(--brand); color: #fff; font-weight: 800; font-size: 12px; border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; }

/* itens com pontilhado de cardápio */
.items { list-style: none; margin: 0; padding: 4px 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 18px; }
.item + .item { border-top: 1px solid var(--soft); }
.line { display: flex; align-items: baseline; gap: 0; min-width: 0; }
.line .nm { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .dots { flex: 1; border-bottom: 2px dotted var(--line-strong); margin: 0 8px; transform: translateY(-4px); min-width: 16px; }
.line .tot { font-weight: 800; font-size: 17px; white-space: nowrap; }
.item .sub { font-size: 13px; color: var(--muted); }
.item .ctl { display: flex; align-items: center; gap: 4px; grid-row: span 2; }
.qty button, .x { width: 32px; height: 32px; border-radius: var(--r); border: 2px solid var(--line-strong); background: #fff; font-weight: 800; line-height: 1; }
.qty { display: flex; align-items: center; gap: 2px; }
.x { color: var(--bad); }
.x:hover { border-color: var(--bad); }
.d-foot { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.total .v { font-family: var(--display); font-weight: 900; font-size: 52px; line-height: .95; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .grow { flex: 1; }

/* ---------- pesquisa ---------- */
.search-hero { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.search-box { display: flex; align-items: center; gap: 10px; background: #fff; border: 2.5px solid var(--ink); border-radius: var(--r); padding: 6px 8px 6px 14px; box-shadow: 0 4px 0 var(--ink); }
.search-box svg { width: 28px; height: 28px; color: var(--brand); }
.search-box input { border: 0; outline: none; flex: 1; min-width: 0; font-size: 22px; font-weight: 700; padding: 8px 0; background: transparent; }
.search-box input::placeholder { color: #B59F88; font-weight: 600; }
.filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.filters .seg { flex: 0 1 auto; }
.res-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.res { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.rcard { text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 3px 0 var(--ink); position: relative; transition: transform .08s; }
.rcard:hover { transform: translateY(-2px); }
.rcard .rtop { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 2px dashed var(--line-strong); }
.rcard .rn { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; min-width: 52px; }
.rcard .rdate { font-size: 13px; color: var(--muted); font-weight: 600; }
.rcard .rtot { font-weight: 800; font-size: 19px; }
.rcard .rbody { padding: 10px 12px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.rcard .stamp { position: static; margin-left: auto; font-size: 14px; align-self: flex-start; flex-shrink: 0; }
mark { background: #FFE0A8; color: inherit; border-radius: 3px; padding: 0 2px; }

/* ---------- tabelas / genéricos ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--soft); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
td.r, th.r { text-align: right; }
tfoot td { font-weight: 800; border-top: 2px solid var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { padding: 14px 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: 0 3px 0 var(--ink); }
.stat .v { font-family: var(--display); font-weight: 900; font-size: 38px; line-height: 1.05; color: var(--brand-dark); }
.bar { height: 12px; background: var(--soft); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--brand); }
.sect { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1; min-width: 140px; }
.note { font-size: 14px; color: var(--muted); background: var(--soft); border-radius: var(--r); padding: 10px 12px; border: 1px dashed var(--line-strong); }
.diff-ok { color: var(--ok); font-weight: 800; }
.diff-bad { color: var(--bad); font-weight: 800; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42,27,18,.5); display: flex; align-items: center; justify-content: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--paper); border-radius: var(--r); width: min(580px, 100%); max-height: 100%; overflow-y: auto; border: 2.5px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 24px 60px rgba(0,0,0,.3); }
.modal.wide { width: min(780px, 100%); }
.m-head { padding: 14px 18px; border-bottom: 2px dashed var(--line-strong); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.m-head h3 { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; color: var(--brand-dark); }
.m-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.m-foot { padding: 14px 18px; border-top: 2px dashed var(--line-strong); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.paygrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.payopt { border: 2px solid var(--line-strong); background: #fff; border-radius: var(--r); padding: 12px 8px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 6px; aspect-ratio: 1.5 / 1; justify-content: center; }
.payopt svg { width: 30px; height: 30px; }
.payopt[aria-pressed="true"] { border-color: var(--brand); background: #FDEBDD; color: var(--brand-dark); box-shadow: 0 3px 0 var(--brand-dark); }
.sumrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sumrow > div { background: var(--soft); border-radius: var(--r); padding: 10px 12px; border: 2px solid var(--line); }
.sumrow .v { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1.05; }
.paylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.paylist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border: 2px solid var(--line); border-radius: var(--r); font-weight: 700; }
.err { color: var(--bad); font-weight: 700; font-size: 15px; margin: 0; }

/* cupom 80mm com borda serrilhada */
.paper-wrap { filter: drop-shadow(0 3px 6px rgba(0,0,0,.15)); }
.paper { background: #FFFEFA; margin: 0 auto; width: min(100%, 350px); padding: 18px 14px 26px; font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre; overflow-x: auto; color: #111;

<script>
/* =========================================================
   Altos Sabores — protótipo da Fase 1 (frente de caixa)
   Dinheiro sempre em centavos (inteiros). Dados ficam no navegador.
   ========================================================= */
const STORE_KEY = 'altos-sabores-pdv-v2';
const PIN_GERENTE = '1234';
const ICON = {
  dinheiro: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v0M18 14.5v0"/>',

  vr: '<path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 3c-2.2 2-2.2 7 0 9v9"/>',
  va: '<path d="M3 5h2.5l2 10h10.5l2-7H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
  busca: '<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.5-4.5"/>',
};
const svg = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const FORMAS = [
  { id: 'dinheiro', nome: 'Dinheiro' },
  { id: 'debito', nome: 'Débito' },
  { id: 'credito', nome: 'Crédito' },
  { id: 'pix', nome: 'Pix' },
  { id: 'vr', nome: 'Vale-refeição' },
  { id: 'va', nome: 'Vale-alimentação' },
];
const PALETA = ['#2F6E8C', '#B8476A', '#6E7B33', '#7A4FA0', '#C08A1E', '#3D7F74', '#A0522D', '#5B6770'];
const cats = () => S.categorias;
const corCat = id => (S.categorias.find(c => c.id === id) || { cor: '#8A7663' }).cor;
/* completa dados que versões anteriores do protótipo não tinham */
function migrar(s) {
  s.categorias = s.categorias || [
    { id: 'Bebida', nome: 'Bebidas', cor: PALETA[0] },
    { id: 'Sobremesa', nome: 'Sobremesas', cor: PALETA[1] },
    { id: 'Outros', nome: 'Outros', cor: PALETA[2] },
  ];
  s.config = Object.assign({ empresa: 'Altos Sabores Restaurante', razao: '', cnpj: '', ie: '', regime: 'Simples Nacional', telefone: '', endereco: '', bairro: '', cidade: '', uf: '', cep: '', rodape: 'Obrigado e volte sempre!' }, s.config);
  s.impressora = Object.assign({ modelo: 'Elgin i9', conexao: 'usb', usb: 'USB001', ip: '192.168.0.50', porta: '9100', com: 'COM3', baud: '9600', papel: 80, corte: true, gaveta: true, autoImprimir: true, vias: 1, testadaEm: null }, s.impressora);
  s.fiscal = Object.assign({ checklist: {} }, s.fiscal);
  /* dados públicos do certificado A1 recebido (o arquivo e a senha NÃO ficam aqui) */
  if (!s.config.razao) s.config.razao = 'Restaurante Altos Sabores Ltda';
  if (!s.config.cnpj) s.config.cnpj = '63.062.421/0001-67';
  s.fiscal.certificado = s.fiscal.certificado || { titular: 'RESTAURANTE ALTOS SABORES LTDA', cnpj: '63.062.421/0001-67', tipo: 'A1 (e-CNPJ)', emissor: 'AC SyngularID Múltipla', validoDe: Date.UTC(2026, 9, 29, 17, 55), validoAte: Date.UTC(2027, 9, 29, 17, 55) };
  if (s.fiscal.checklist.cert === undefined) s.fiscal.checklist.cert = true;
  s.produtos.forEach(p => { if (p.codigo == null) p.codigo = ''; p.fiscal = p.fiscal || { ncm: '', cfop: '', cest: '' }; });
  return s;
}

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const n2 = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kgTxt = g => (g / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const hora = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dataHora = t => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const uid = () => Math.random().toString(36).slice(2, 10);
const formaNome = id => (FORMAS.find(f => f.id === id) || { nome: id }).nome;
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function parseMoney(s) {
  s = String(s ?? '').trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? Math.round(v * 100) : NaN;
}
/* preço do prato: gramas × preço do kg, arredondado ao centavo (meio para cima) */
const precoPrato = (gramas, precoKgCents) => Math.round(gramas * precoKgCents / 1000);
function desde(t) {
  const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
}
const inicioDoDia = (d = 0) => { const x = new Date(); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - d); return x.getTime(); };
function quandoTxt(t) {
  if (t >= inicioDoDia()) return 'Hoje, ' + hora(t);
  if (t >= inicioDoDia(1)) return 'Ontem, ' + hora(t);
  return new Date(t).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '') + ', ' + hora(t);
}

/* ---------- dados de exemplo ---------- */
function seed() {
  const now = Date.now(), min = 60000;
  const P = (nome, cat, reais) => ({ id: uid(), nome, cat, precoCents: Math.round(reais * 100), ativo: true });
  const produtos = [
    P('Refrigerante lata 350ml', 'Bebida', 6), P('Refrigerante 600ml', 'Bebida', 8), P('Água mineral 500ml', 'Bebida', 4),
    P('Água com gás 500ml', 'Bebida', 4.5), P('Suco natural 400ml', 'Bebida', 9), P('Cerveja long neck', 'Bebida', 10),
    P('Pudim', 'Sobremesa', 8), P('Mousse de maracujá', 'Sobremesa', 7), P('Sorvete (bola)', 'Sobremesa', 6), P('Salada de frutas', 'Sobremesa', 7.5),
    P('Refrigerante 2L', 'Bebida', 14), P('Suco de laranja 400ml', 'Bebida', 9), P('Água de coco 300ml', 'Bebida', 7), P('Cerveja lata 350ml', 'Bebida', 7),
    P('Brigadeiro', 'Sobremesa', 3), P('Doce de leite', 'Sobremesa', 5),
    P('Café', 'Outros', 3), P('Embalagem marmitex', 'Outros', 2),
  ];
  const seq = { Bebida: 101, Sobremesa: 201, Outros: 301 };
  produtos.sort((a, b) => a.cat.localeCompare(b.cat)).forEach(p => p.codigo = String(seq[p.cat]++));
  const prod = nome => produtos.find(p => p.nome === nome);
  const kg = g => ({ id: uid(), tipo: 'kg', nome: 'Refeição por quilo', gramas: g, qtd: 1, unitCents: 9500, totalCents: precoPrato(g, 9500) });
  const un = (nome, q = 1) => { const p = prod(nome); return { id: uid(), tipo: 'un', produtoId: p.id, nome: p.nome, qtd: q, unitCents: p.precoCents, totalCents: p.precoCents * q }; };
  const C = (numero, abertaEm, itens) => { itens.forEach((i, k) => { if (i.tipo === 'kg') i.em = Math.min(Date.now(), abertaEm + (k + 1) * 60000); }); return { id: uid(), numero, status: 'aberta', abertaEm, itens, pagamentos: [], trocoCents: 0, cpf: '', log: [], exemplo: true }; };
  /* comanda paga: formas = [['dinheiro', 5000], ['debito']] — a última fica com o restante */
  const F = (numero, fechadaEm, itens, formas, extra = {}) => {
    const c = C(numero, fechadaEm - 32 * min, itens);
    c.status = 'fechada'; c.fechadaEm = fechadaEm;
    let resto = totalComanda(c);
    c.pagamentos = formas.map(([forma, v], k) => { const val = k === formas.length - 1 ? resto : v; resto -= val; return { forma, valorCents: val }; });
    return Object.assign(c, extra);
  };
  const dia = (d, h, m) => { const x = new Date(); x.setDate(x.getDate() - d); x.setHours(h, m, 0, 0); return x.getTime(); };
  const comandas = [
    C(12, now - 18 * min, [kg(507), un('Refrigerante lata 350ml')]),
    C(27, now - 9 * min, [kg(412), un('Suco natural 400ml')]),
    C(31, now - 4 * min, [kg(380), kg(655), un('Água mineral 500ml', 2)]),
    F(8, now - 52 * min, [kg(468), un('Água mineral 500ml'), un('Pudim')], [['pix']]),
    F(15, now - 40 * min, [kg(590), kg(321), un('Refrigerante 600ml')], [['dinheiro', 5000], ['debito']]),
    // ontem
    F(3, dia(1, 11, 48), [kg(522), un('Refrigerante lata 350ml')], [['vr']], { cpf: '123.456.789-09' }),
    F(12, dia(1, 12, 15), [kg(610), un('Suco natural 400ml'), un('Mousse de maracujá')], [['credito']]),

/* ---------- cupom (o que sai na impressora térmica 80mm) ---------- */
const colunas = () => (S.impressora && +S.impressora.papel === 58 ? 32 : 48);
const lin = (ch = '-') => ch.repeat(colunas());
const lr = (l, r) => { const COL = colunas(); l = String(l); r = String(r); const sp = COL - l.length - r.length; return sp >= 1 ? l + ' '.repeat(sp) + r : l.slice(0, COL - r.length - 1) + ' ' + r; };
const centro = s => { const COL = colunas(); s = String(s); const p = Math.max(0, Math.floor((COL - s.length) / 2)); return ' '.repeat(p) + s; };
function cupomComanda(c, tipo) {
  const L = [];
  L.push(...cabecalho());
  L.push(centro(tipo === 'conf' ? 'CONFERÊNCIA DE CONTA' : 'COMPROVANTE DE PAGAMENTO'));
  L.push(lr('COMANDA ' + c.numero, dataHora(tipo === 'conf' ? Date.now() : (c.fechadaEm || Date.now())))), L.push(lin());
  c.itens.forEach(i => {
    L.push(i.nome.slice(0, colunas()));
    if (i.tipo === 'kg') L.push(lr(`  ${kgTxt(i.gramas)} kg x ${n2(i.unitCents)}`, n2(i.totalCents)));
    else L.push(lr(`  ${i.qtd} un x ${n2(i.unitCents)}`, n2(i.totalCents)));
  });
  L.push(lin(), lr('TOTAL', brl(totalComanda(c))));
  if (tipo !== 'conf') {
    c.pagamentos.forEach(p => L.push(lr(formaNome(p.forma), n2(p.valorCents))));
    if (c.trocoCents) L.push(lr('Troco', n2(c.trocoCents)));
    if (c.cpf) L.push(lr('CPF', c.cpf));
  }
  L.push(lin(), centro('*** NÃO É DOCUMENTO FISCAL ***'));
  if (tipo !== 'conf') L.push(centro('Na Fase 2 aqui sai a NFC-e'), centro('com QR Code da SEFAZ'));
  L.push('', centro(S.config.rodape || ''));
  return L.join('\n');
}
function verCupom(texto, titulo) {
  openModal(`
    <div class="m-head"><h3>${esc(titulo)}</h3>${xBtn}</div>
    <div class="m-body"><div class="paper-wrap"><div class="paper" style="width:min(100%, calc(${colunas()}ch + 28px))">${esc(texto)}</div></div>
    <p class="note" style="margin:0">Pré-visualização do papel de 80mm. No sistema instalado no computador do caixa, isto vai direto para a impressora térmica, corta o papel e abre a gaveta quando o pagamento tem dinheiro.</p></div>
    <div class="m-foot"><button class="btn primary" data-close>OK</button></div>`);
}

  $('#cancel') && ($('#cancel').onclick = () => {

    pedirGerente('Cancelar comanda ' + c.numero, `A comanda tem ${brl(totalComanda(c))} lançados. O cancelamento fica registrado com o motivo.`, motivo => {
      c.status = 'cancelada'; c.canceladaEm = Date.now(); c.log.push({ em: Date.now(), acao: 'cancelada', motivo });
      ui.sel = null; save(); render(); toast(`Comanda ${c.numero} cancelada`);
    }, true);
  });
  $('#reabrir') && ($('#reabrir').onclick = () => {
    if (abertas().some(x => x.numero === c.numero)) { toast(`Já existe uma comanda ${c.numero} aberta. Feche ela antes.`); return; }
    pedirGerente('Reabrir comanda ' + c.numero, 'Os pagamentos registrados serão desfeitos e a comanda volta para a lista de abertas.', motivo => {
      c.log.push({ em: Date.now(), acao: 'reaberta', motivo, pagamentosAnteriores: c.pagamentos });
      c.status = 'aberta'; c.pagamentos = []; c.trocoCents = 0; delete c.fechadaEm; delete c.canceladaEm;
      ui.lista = 'abertas'; save(); render(); toast(`Comanda ${c.numero} reaberta`);
    }, true);
  });
}
function removerItem(c, i) {
  if (!i) return;
  confirmar('Remover item', `Remover <b>${esc(i.nome)}</b> (${brl(i.totalCents)}) da comanda ${c.numero}? Fica registrado no histórico.`, 'Remover', () => {
    c.itens = c.itens.filter(x => x.id !== i.id);
    c.log.push({ em: Date.now(), acao: 'item removido', item: i.nome, valorCents: i.totalCents, operador: S.caixa.operador || '' });
    save(); viewComandas(); toast('Item removido');
  }, true);
}
function novaComanda(v) {
  let n = parseInt(String(v).replace(/\D/g, ''), 10);
  if (!(n > 0)) n = Math.max(0, ...abertas().map(c => c.numero)) + 1;
  const ex = abertas().find(c => c.numero === n);
  ui.lista = 'abertas';
  if (ex) { ui.sel = ex.id; viewComandas(); toast(`Comanda ${n} já estava aberta`); }
  else {
    const c = { id: uid(), numero: n, status: 'aberta', abertaEm: Date.now(), itens: [], pagamentos: [], trocoCents: 0, cpf: '', log: [] };
    S.comandas.push(c); ui.sel = c.id; save(); render(); toast(`Comanda ${n} aberta`);
  }
  $('#peso') && $('#peso').focus();
}

/* ---------- pagamento ---------- */
function abrirPagamento(c) {
  if (!S.caixa.aberto) { toast('Abra o caixa antes de receber.'); go('caixa'); return; }
  if (!c.itens.length) return;
  const st = { pags: [], forma: 'dinheiro', cpf: c.cpf || '' };
  const tot = totalComanda(c);
  const pago = () => st.pags.reduce((s, p) => s + p.valorCents, 0);
  const falta = () => Math.max(0, tot - pago());
  const sobra = () => Math.max(0, pago() - tot);
  const dinheiro = () => st.pags.filter(p => p.forma === 'dinheiro').reduce((s, p) => s + p.valorCents, 0);

  openModal(`
    <div class="m-head"><h3>Receber · comanda ${c.numero}</h3>${xBtn}</div>
    <div class="m-body">
      <div class="sumrow num" id="sum"></div>
      <div class="field"><span class="label">Forma de pagamento</span>
        <div class="paygrid" id="formas">${FORMAS.map(f => `<button class="payopt" data-f="${f.id}">${svg(f.id)}${f.nome}</button>`).join('')}</div></div>
      <form class="row" id="addp">
        <div class="field"><label class="label" for="valor">Valor</label><input class="input big num" id="valor" inputmode="decimal" autocomplete="off"></div>
        <button class="btn primary big" type="submit">Adicionar</button>
      </form>
      <div class="row">
        <div class="field" style="max-width:160px"><label class="label" for="div">Dividir a conta em</label><input class="input num" id="div" type="number" min="2" max="20" value="2"></div>
        <button class="btn" id="divb" type="button">Valor por pessoa</button>
      </div>
      <ul class="paylist" id="plist"></ul>
      <div class="field"><label class="label" for="cpf">CPF na nota (opcional)</label><input class="input" id="cpf" inputmode="numeric" placeholder="000.000.000-00" value="${esc(st.cpf)}" autocomplete="off"></div>
      <p class="err" id="perr" hidden></p>
    </div>
    <div class="m-foot"><button class="btn" data-close>Voltar</button><button class="btn ok big" id="fin">Confirmar pagamento</button></div>`, r => {
    const valor = $('#valor', r);
    const draw = () => {
      $('#sum', r).innerHTML = `<div><span class="label">Total</span><div class="v">${brl(tot)}</div></div>
        <div><span class="label">Pago</span><div class="v">${brl(pago())}</div></div>
        ${sobra() ? `<div style="background:var(--ok-soft);border-color:#B9DCC5"><span class="label">Troco</span><div class="v" style="color:var(--ok)">${brl(sobra())}</div></div>`
                  : `<div style="background:${falta() ? 'var(--warn-soft)' : 'var(--ok-soft)'}"><span class="label">Falta</span><div class="v">${brl(falta())}</div></div>`}`;
      r.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === st.forma));
      $('#plist', r).innerHTML = st.pags.map((p, k) => `<li><span style="display:flex;gap:8px;align-items:center">${svg(p.forma)}${formaNome(p.forma)}</span><span class="num" style="display:flex;gap:10px;align-items:center"><b>${brl(p.valorCents)}</b><button class="x" data-rp="${k}" aria-label="Remover pagamento">✕</button></span></li>`).join('');
      r.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { st.pags.splice(+b.dataset.rp, 1); valor.value = n2(falta()); draw(); });
      $('#fin', r).disabled = falta() > 0;
    };
    valor.value = n2(tot);
    r.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { st.forma = b.dataset.f; draw(); valor.focus(); valor.select(); });
    $('#addp', r).onsubmit = e => {
      e.preventDefault(); $('#perr', r).hidden = true;
      const v = parseMoney(valor.value);
      if (!(v > 0)) { $('#perr', r).textContent = 'Digite um valor, ex.: 50,00'; $('#perr', r).hidden = false; return; }
      if (st.forma !== 'dinheiro' && v > falta()) { $('#perr', r).textContent = `${formaNome(st.forma)} não pode passar do que falta (${brl(falta())}). Troco só em dinheiro.`; $('#perr', r).hidden = false; return; }
      st.pags.push({ forma: st.forma, valorCents: v });
      valor.value = falta() ? n2(falta()) : ''; draw();
      (falta() ? valor : $('#fin', r)).focus();
    };
    $('#divb', r).onclick = () => { const n = Math.max(2, Math.min(20, parseInt($('#div', r).value, 10) || 2)); valor.value = n2(Math.ceil(tot / n)); valor.focus(); valor.select(); };
    $('#fin', r).onclick = () => {
      const troco = sobra();
      if (troco > dinheiro()) { $('#perr', r).textContent = 'O troco é maior que o dinheiro recebido. Confira os valores.'; $('#perr', r).hidden = false; return; }
      c.pagamentos = st.pags; c.trocoCents = troco; c.cpf = $('#cpf', r).value.trim();
      c.status = 'fechada'; c.fechadaEm = Date.now();
      save(); closeModal(); ui.sel = null; ui.cx = null; render();
      const tit = `Comanda ${c.numero} paga${troco ? ' · troco ' + brl(troco) : ''}`;
      if (S.impressora.autoImprimir) verCupom(cupomComanda(c, 'pago'), tit); else toast(tit);
    };
    draw(); valor.focus(); valor.select();
  });
}

/* =========================================================
   PESQUISAR
   ========================================================= */
const STATUS_NOME = { aberta: 'aberta', fechada: 'paga', cancelada: 'cancelada' };
function casa(c, qRaw) {
  const q = norm(qRaw).trim();
  if (!q) return true;
  if (/^\d+$/.test(q)) {                         // só número: nº da comanda ou pedaço do CPF
    if (String(c.numero) === q) return true;
    return q.length >= 3 && String(c.cpf || '').replace(/\D/g, '').includes(q);
  }
  if (/^\d+,\d{1,2}$/.test(q)) return n2(totalComanda(c)).includes(q);   // valor, ex.: 54,17
  const hay = norm([c.numero, ...c.itens.map(i => i.nome), ...c.pagamentos.map(p => formaNome(p.forma)), c.cpf, STATUS_NOME[c.status], ...(c.log || []).map(l => l.motivo || '')].join(' '));
  return q.split(/\s+/).every(w => hay.includes(w));
}
function resultados() {
  const desdeT = ui.fPeriodo === 'hoje' ? inicioDoDia() : ui.fPeriodo === 'ontem' ? inicioDoDia(1) : ui.fPeriodo === '7' ? inicioDoDia(6) : 0;
  const ateT = ui.fPeriodo === 'ontem' ? inicioDoDia() : Infinity;
  return S.comandas
    .filter(c => ui.fStatus === 'todas' || c.status === ui.fStatus)
    .filter(c => { const t = quandoComanda(c); return t >= desdeT && t < ateT; })
    .filter(c => casa(c, ui.q))
    .sort((a, b) => ((b.status === 'aberta') - (a.status === 'aberta')) || (quandoComanda(b) - quandoComanda(a)));
}
function marca(txt) {
  const q = norm(ui.q).trim();
  if (!q || /^\d/.test(q)) return esc(txt);
  const words = q.split(/\s+/).filter(Boolean);
  const n = norm(txt); let out = '', i = 0;
  while (i < txt.length) {
    const w = words.find(w => n.startsWith(w, i));
    if (w) { out += `<mark>${esc(txt.slice(i, i + w.length))}</mark>`; i += w.length; } else { out += esc(txt[i]); i++; }
  }
  return out;
}
function viewPesquisar() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, t]) => `<button data-${key}="${v}" aria-pressed="${ui[key] === v}">${t}</button>`).join('')}</div>`;

        ${ui.q ? `<button class="btn flat" type="button" id="limpa">Limpar</button>` : ''}
      </form>
      <div class="filters">
        ${seg('fStatus', [['todas', 'Todas'], ['aberta', 'Abertas'], ['fechada', 'Pagas'], ['cancelada', 'Canceladas']])}
        ${seg('fPeriodo', [['hoje', 'Hoje'], ['ontem', 'Ontem'], ['7', '7 dias'], ['tudo', 'Tudo']])}
      </div>
    </div>
    <div id="res"></div>`;
  const q = $('#q');
  q.oninput = () => { ui.q = q.value; drawRes(); };
  $('#sf').onsubmit = e => { e.preventDefault(); const r = resultados(); if (r.length === 1) abrirDaBusca(r[0].id); };
  $('#limpa') && ($('#limpa').onclick = () => { ui.q = ''; viewPesquisar(); $('#q').focus(); });
  document.querySelectorAll('[data-fStatus],[data-fstatus]').forEach(b => b.onclick = () => { ui.fStatus = b.dataset.fstatus; viewPesquisar(); });
  document.querySelectorAll('[data-fPeriodo],[data-fperiodo]').forEach(b => b.onclick = () => { ui.fPeriodo = b.dataset.fperiodo; viewPesquisar(); });
  drawRes();

function drawRes() {
  const r = resultados();

  $('#res').innerHTML = `

    : `<div class="empty">Nenhuma comanda encontrada${ui.q ? ` para “${esc(ui.q)}”` : ''}.<br>Tente outro período ou status.</div>`}`;
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => abrirDaBusca(b.dataset.open));

function abrirDaBusca(id) {

/* =========================================================
   CAIXA
   ========================================================= */
function resumoCaixa() {
  const desdeT = S.caixa.abertoEm || 0;
  const vendas = S.comandas.filter(c => c.status === 'fechada' && c.fechadaEm >= desdeT);
  const porForma = Object.fromEntries(FORMAS.map(f => [f.id, 0]));
  let troco = 0;
  vendas.forEach(c => { c.pagamentos.forEach(p => porForma[p.forma] += p.valorCents); troco += c.trocoCents || 0; });
  porForma.dinheiro -= troco;
  const sup = S.caixa.movimentos.filter(m => m.tipo === 'suprimento').reduce((s, m) => s + m.valorCents, 0);
  const san = S.caixa.movimentos.filter(m => m.tipo === 'sangria').reduce((s, m) => s + m.valorCents, 0);
  const totalVendas = vendas.reduce((s, c) => s + totalComanda(c), 0);
  const esperado = { ...porForma, dinheiro: S.caixa.fundoCents + porForma.dinheiro + sup - san };
  return { vendas, porForma, sup, san, totalVendas, esperado };
}

            ${S.caixa.movimentos.map(m => `<tr><td>${hora(m.em)}</td><td>${m.tipo === 'sangria' ? 'Sangria' : 'Suprimento'}</td><td>${esc(m.motivo)}</td><td class="r" style="color:${m.tipo === 'sangria' ? 'var(--bad)' : 'var(--ok)'}">${m.tipo === 'sangria' ? '−' : '+'}${brl(m.valorCents)}</td></tr>`).join('')}

  $('#rf').onsubmit = e => {

function fecharCaixa() {
  const ab = abertas();

    const linhas = FORMAS.filter(f => R.esperado[f.id] || f.id === 'dinheiro');
    openModal(`
      <div class="m-head"><h3>Fechar caixa · conferência</h3>${xBtn}</div>
      <div class="m-body">

          <thead><tr><th>Forma</th><th class="r">Sistema</th><th class="r">Contado</th><th class="r">Diferença</th></tr></thead>
          <tbody>${linhas.map(f => `<tr><td>${f.nome}</td><td class="r">${brl(R.esperado[f.id])}</td>
            <td class="r"><input class="input num" style="width:120px;text-align:right;padding:6px 8px" data-ct="${f.id}" inputmode="decimal" value="${n2(R.esperado[f.id])}" aria-label="Contado em ${f.nome}"></td>
            <td class="r" data-df="${f.id}">${brl(0)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Total</td><td class="r">${brl(linhas.reduce((s, f) => s + R.esperado[f.id], 0))}</td><td class="r" id="ctTot"></td><td class="r" id="dfTot"></td></tr></tfoot>
        </table></div>
        <p class="note" style="margin:0">O dinheiro do sistema já inclui o fundo de troco (${brl(S.caixa.fundoCents)}), suprimentos (${brl(R.sup)}) e desconta sangrias (${brl(R.san)}).</p>
      </div>
      <div class="m-foot"><button class="btn" data-close>Voltar</button><button class="btn primary" id="cfin">Fechar caixa e imprimir</button></div>`, r => {
      const lerContado = () => Object.fromEntries(linhas.map(f => { const v = parseMoney($(`[data-ct="${f.id}"]`, r).value); return [f.id, isNaN(v) ? 0 : v]; }));
      const upd = () => {
        const ct = lerContado(); let td = 0, tc = 0;
        linhas.forEach(f => {
          const d = ct[f.id] - R.esperado[f.id]; td += d; tc += ct[f.id];
          const el = $(`[data-df="${f.id}"]`, r);
          el.textContent = d === 0 ? 'ok' : (d > 0 ? 'sobra ' : 'falta ') + brl(Math.abs(d));
          el.className = 'r ' + (d === 0 ? 'diff-ok' : 'diff-bad');
        });
        $('#ctTot', r).textContent = brl(tc);
        $('#dfTot', r).textContent = td === 0 ? 'ok' : (td > 0 ? 'sobra ' : 'falta ') + brl(Math.abs(td));

      };

      $('#cfin', r).onclick = () => {

        const fch = { id: uid(), operador: S.caixa.operador, abertoEm: S.caixa.abertoEm, fechadoEm: Date.now(), fundoCents: S.caixa.fundoCents,
          sangriasCents: R.san, suprimentosCents: R.sup, totalVendasCents: R.totalVendas, comandas: R.vendas.length,
          esperado: R.esperado, contado: ct, diferencaCents: linhas.reduce((s, f) => s + ct[f.id] - R.esperado[f.id], 0) };
        S.fechamentos.unshift(fch);

        save(); closeModal(); render();
        const L = [...cabecalho(), centro('FECHAMENTO DE CAIXA'), lr('Operador', fch.operador), lr('Abertura', dataHora(fch.abertoEm)), lr('Fechamento', dataHora(fch.fechadoEm)), lin(),

          lr('FORMA', 'SISTEMA / CONTADO'), ...linhas.map(f => lr(f.nome, `${n2(fch.esperado[f.id])} / ${n2(ct[f.id])}`)), lin(),

}

function viewRelatorio() {
  const hoje = S.comandas.filter(c => c.status === 'fechada' && c.fechadaEm >= inicioDoDia());
  const tot = hoje.reduce((s, c) => s + totalComanda(c), 0);
  const gramas = hoje.reduce((s, c) => s + c.itens.filter(i => i.tipo === 'kg').reduce((a, i) => a + i.gramas, 0), 0);
  const fat = Object.fromEntries(FORMAS.map(f => [f.id, 0]));
  hoje.forEach(c => { c.pagamentos.forEach(p => fat[p.forma] += p.valorCents); fat.dinheiro -= c.trocoCents || 0; });
  const prods = {};
  hoje.forEach(c => c.itens.forEach(i => { const k = i.tipo === 'kg' ? 'Refeição por quilo' : i.nome; prods[k] = prods[k] || { q: 0, v: 0, kg: i.tipo === 'kg' }; prods[k].q += i.tipo === 'kg' ? 1 : i.qtd; prods[k].v += i.totalCents; }));
  const top = Object.entries(prods).sort((a, b) => b[1].v - a[1].v);
  const maxF = Math.max(1, ...Object.values(fat));
  const canc = S.comandas.filter(c => c.status === 'cancelada' && c.canceladaEm >= inicioDoDia());
  const removidos = S.comandas.flatMap(c => (c.log || []).filter(l => l.em >= inicioDoDia()).map(l => ({ ...l, numero: c.numero })));
  $('#app').innerHTML = `
    <div style="margin-bottom:16px"><span class="label">Relatório</span><h1 class="title">Hoje, ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</h1></div>
    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><span class="label">Faturamento</span><div class="v num">${brl(tot)}</div></div>
      <div class="stat"><span class="label">Comandas pagas</span><div class="v num">${hoje.length}</div></div>
      <div class="stat"><span class="label">Ticket médio</span><div class="v num">${brl(hoje.length ? Math.round(tot / hoje.length) : 0)}</div></div>
      <div class="stat"><span class="label">Comida vendida</span><div class="v num">${kgTxt(gramas)} kg</div></div>
    </div>
    <div class="grid2">
      <div class="panel pad sect"><h3 class="h3">Por forma de pagamento</h3>
        ${FORMAS.map(f => `<div style="display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 100px;gap:10px;align-items:center" class="num"><span>${f.nome}</span><div class="bar"><i style="width:${Math.round(100 * Math.max(0, fat[f.id]) / maxF)}%"></i></div><b style="text-align:right">${brl(fat[f.id])}</b></div>`).join('')}
      </div>
      <div class="panel pad sect"><h3 class="h3">O que mais vendeu</h3>
        ${top.length ? `<div class="tbl-wrap"><table class="num"><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Valor</th></tr></thead>
        <tbody>${top.map(([n, d]) => `<tr><td>${esc(n)}</td><td class="r">${d.q}${d.kg ? ' pratos' : ''}</td><td class="r">${brl(d.v)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Sem vendas hoje ainda.</p>'}
      </div>
      <div class="panel pad sect"><h3 class="h3">Cancelamentos e alterações</h3>
        ${removidos.length ? `<div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Comanda</th><th>O quê</th></tr></thead><tbody>
          ${removidos.sort((a, b) => b.em - a.em).map(l => `<tr><td class="num">${hora(l.em)}</td><td class="num">${l.numero}</td><td>${esc(l.acao)}${l.item ? ': ' + esc(l.item) + ' (' + brl(l.valorCents) + ')' : ''}${l.motivo ? ' · ' + esc(l.motivo) : ''}</td></tr>`).join('')}</tbody></table></div>`
          : '<p class="muted" style="margin:0">Nada cancelado ou removido hoje.</p>'}
        ${canc.length ? `<p class="muted" style="margin:0">${canc.length} comanda(s) cancelada(s) hoje.</p>` : ''}

        <p style="margin:0">Na <b>Fase 3</b> esta tela gera, para qualquer período, o arquivo ZIP com todos os XMLs das NFC-e (autorizadas, canceladas e inutilizadas), mais um resumo em PDF e uma planilha para o contador.</p>

/* =========================================================
   CUPOM: cabeçalho com os dados da empresa
   ========================================================= */
function quebra(s) {
  const C = colunas(), out = []; let cur = '';
  String(s).split(/\s+/).forEach(w => { if ((cur + ' ' + w).trim().length > C) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) out.push(cur);
  return out;
}
function cabecalho(cfg = S.config) {
  const L = [centro((cfg.empresa || '').toUpperCase())];
  if (cfg.razao) quebra(cfg.razao).forEach(l => L.push(centro(l)));
  L.push(centro('CNPJ ' + (cfg.cnpj || '__.___.___/____-__') + (cfg.ie ? '  IE ' + cfg.ie : '')));
  const end = [cfg.endereco, cfg.bairro].filter(Boolean).join(', ');
  if (end) quebra(end).forEach(l => L.push(centro(l)));
  const cid = [[cfg.cidade, cfg.uf].filter(Boolean).join('/'), cfg.cep ? 'CEP ' + cfg.cep : ''].filter(Boolean).join(' · ');
  if (cid) L.push(centro(cid));
  if (cfg.telefone) L.push(centro('Tel. ' + cfg.telefone));
  L.push(lin());
  return L;
}

        <button class="btn" type="submit">Adicionar categoria</button>
      </form>
    </section>`;
  const drawList = () => {
    const q = norm(ui.pq.trim());
    const lista = S.produtos.filter(p => (ui.pcat === 'todas' || p.cat === ui.pcat) && (!q || norm(p.nome).includes(q) || p.codigo === ui.pq.trim()));
    const grupos = [...cats(), { id: null, nome: 'Sem categoria', cor: '#8A7663' }];
    const row = p => `<div class="prow ${p.ativo ? '' : 'off'}">
        <span class="cod">${esc(p.codigo || '—')}</span>

        <button class="btn" data-pe="${p.id}">Editar</button>
      </div>`;
    $('#plist').innerHTML = lista.length ? grupos.map(k => {
      const ps = lista.filter(p => k.id ? p.cat === k.id : !cats().some(x => x.id === p.cat));
      return ps.length ? `<div class="cat-head"><span class="sq" style="background:${k.cor}"></span><h3>${esc(k.nome)}</h3><span class="muted num">${ps.length}</span></div>${ps.map(row).join('')}` : '';
    }).join('') : `<div class="empty">Nenhum produto encontrado${ui.pq ? ` para “${esc(ui.pq)}”` : ''}.</div>`;
    document.querySelectorAll('[data-pa]').forEach(i => i.onchange = () => { const p = S.produtos.find(x => x.id === i.dataset.pa); p.ativo = i.checked; save(); drawList(); toast(p.ativo ? `${p.nome} volta a aparecer na comanda` : `${p.nome} saiu da comanda`); });
    document.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => prodModal(S.produtos.find(x => x.id === b.dataset.pe)));
  };
  drawList();
  $('#pq').oninput = e => { ui.pq = e.target.value; drawList(); };
  document.querySelectorAll('[data-pcat]').forEach(b => b.onclick = () => { ui.pcat = b.dataset.pcat; viewConfig(); });
  $('#pnew').onclick = () => prodModal();
  document.querySelectorAll('[data-ecat]').forEach(b => b.onclick = () => catModal(cats().find(k => k.id === b.dataset.ecat)));
  let cor = PALETA[cats().length % PALETA.length];
  document.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { cor = b.dataset.sw; document.querySelectorAll('[data-sw]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#ncat').onsubmit = e => {
    e.preventDefault();
    const nome = $('#ncn').value.trim();
    if (!nome) { toast('Digite o nome da categoria'); return; }
    if (cats().some(k => norm(k.nome) === norm(nome))) { toast('Já existe uma categoria com esse nome'); return; }
    S.categorias.push({ id: uid(), nome, cor }); save(); viewConfig(); toast(`Categoria ${nome} criada`);
  };
}
function prodModal(p) {

    <form class="m-body" id="pf" autocomplete="off">

    </div>`, r => {
    const er = t => { $('#ferr', r).textContent = t; $('#ferr', r).hidden = false; };
    $('#pf', r).onsubmit = e => {
      e.preventDefault();
      const nome = $('#fn', r).value.trim(), preco = parseMoney($('#fp', r).value), codigo = $('#fco', r).value.trim();
      if (!nome) return er('Digite o nome do produto.');
      if (!(preco > 0)) return er('Digite o preço, ex.: 6,00');
      if (codigo && S.produtos.some(x => x !== p && x.codigo === codigo)) return er(`O código ${codigo} já é de outro produto.`);
      const dados = { nome, cat: $('#fc', r).value, precoCents: preco, codigo, ativo: $('#fa', r).checked, fiscal: { ncm: $('#fncm', r).value.trim(), cfop: $('#fcfop', r).value.trim(), cest: $('#fcest', r).value.trim() } };
      if (p) Object.assign(p, dados); else S.produtos.push({ id: uid(), ...dados });

      if (e.submitter && e.submitter.id === 'fmore') { ui.pcat = dados.cat; prodModal(); }

    $('#fdel', r) && ($('#fdel', r).onclick = () => confirmar('Excluir produto', `Excluir <b>${esc(p.nome)}</b>? As comandas antigas continuam mostrando o item normalmente.`, 'Excluir', () => {
      S.produtos = S.produtos.filter(x => x !== p); save(); viewConfig(); toast(`${p.nome} excluído`);
    }, true));
  });
}
function catModal(k) {
  let cor = k.cor;
  const n = S.produtos.filter(p => p.cat === k.id).length;
  openModal(`
    <div class="m-head"><h3>Categoria</h3>${xBtn}</div>
    <form class="m-body" id="cf">
      <div class="field"><label class="label" for="cn">Nome</label><input class="input big" id="cn" value="${esc(k.nome)}" autofocus></div>
      <div class="field"><span class="label">Cor</span><div class="swatches">${PALETA.map((c, i) => `<button type="button" class="swatch" data-sw2="${c}" style="background:${c}" aria-pressed="${c === k.cor}" aria-label="Cor ${i + 1}"></button>`).join('')}</div></div>
      <p class="muted" style="margin:0">${n} ${n === 1 ? 'produto' : 'produtos'} nesta categoria.</p>
      <p class="err" id="cerr" hidden></p>
    </form>
    <div class="m-foot"><button class="btn danger" id="cdel" type="button" style="margin-right:auto">Excluir categoria</button><button class="btn" data-close>Cancelar</button><button class="btn primary" type="submit" form="cf">Salvar</button></div>`, r => {
    r.querySelectorAll('[data-sw2]').forEach(b => b.onclick = () => { cor = b.dataset.sw2; r.querySelectorAll('[data-sw2]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('#cf', r).onsubmit = e => {
      e.preventDefault(); const nome = $('#cn', r).value.trim();
      if (!nome) { $('#cerr', r).textContent = 'Digite o nome.'; $('#cerr', r).hidden = false; return; }
      k.nome = nome; k.cor = cor; save(); closeModal(); viewConfig(); toast('Categoria salva');
    };
    $('#cdel', r).onclick = () => {
      if (n) { $('#cerr', r).textContent = `Mova ou exclua os ${n} produtos desta categoria antes de excluí-la.`; $('#cerr', r).hidden = false; return; }
      if (cats().length === 1) { $('#cerr', r).textContent = 'É preciso ter pelo menos uma categoria.'; $('#cerr', r).hidden = false; return; }
      S.categorias = S.categorias.filter(x => x !== k); if (ui.cat === k.id) ui.cat = cats()[0].id; if (ui.pcat === k.id) ui.pcat = 'todas';
      save(); closeModal(); viewConfig(); toast('Categoria excluída');
    };
  });
}

      <div class="flow">
        <div><b>Comanda paga</b>O caixa confirma o pagamento.</div>
        <div><b>Sistema envia</b>Os itens e o pagamento vão para o serviço emissor.</div>
        <div><b>SEFAZ autoriza</b>Leva de 2 a 5 segundos.</div>
        <div><b>Cupom sai</b>Com QR Code e chave de acesso.</div>
        <div><b>XML guardado</b>Fica 5 anos e vai para o contador todo mês.</div>
      </div>
    </section>
    ${certHtml()}
    <section class="panel pad sect">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h3 class="h3">O que precisa antes de ligar a nota</h3><span class="tag ${feitos === CHECK.length ? 'ok' : 'new'} num">${feitos} de ${CHECK.length} prontos</span></div>
      <div class="bar"><i style="width:${Math.round(100 * feitos / CHECK.length)}%"></i></div>
      <ul class="check">${CHECK.map(([k, t, d]) => `<li class="${S.fiscal.checklist[k] ? 'done' : ''}"><label><input type="checkbox" data-ck="${k}" ${S.fiscal.checklist[k] ? 'checked' : ''}><span><b>${t}</b><small>${d}</small></span></label></li>`).join('')}</ul>
      <p class="muted" style="margin:0;font-size:14px">Marque cada item quando estiver resolvido. Os quatro primeiros são com o contador.</p>
    </section>
    <section class="panel pad sect">
      <h3 class="h3">Regras que mudam o dia a dia</h3>
      <ul class="rules">
        <li><b>Nota emitida não se edita.</b> Para corrigir, cancela e emite outra. O prazo de cancelamento é curto: em geral 30 minutos, depende do estado.</li>
        <li><b>Reabrir comanda paga</b> vai cancelar a nota automaticamente, com senha do gerente e motivo.</li>
        <li><b>Sem internet:</b> a nota sai em modo de contingência e é enviada sozinha quando a internet volta. A venda não para.</li>
        <li><b>CPF na nota</b> é opcional, só quando o cliente pedir.</li>
        <li><b>Todo mês</b> o sistema junta os XMLs das notas num arquivo ZIP para o contador.</li>
      </ul>
    </section>
    <section class="panel pad sect">
      <fieldset class="locked" disabled>
        <legend>Ajustes da nota · liberados na Fase 2</legend>
        <div class="form-grid">
          <div class="field"><label class="label">Serviço emissor</label><select class="input"><option>Escolher na Fase 2</option></select></div>
          <div class="field"><label class="label">Ambiente</label><select class="input"><option>Homologação (testes)</option><option>Produção</option></select></div>
          <div class="field"><label class="label">Série</label><input class="input" value="1"></div>
          <div class="field"><label class="label">Próximo número</label><input class="input" value="1"></div>
          <div class="field"><label class="label">ID do CSC</label><input class="input" placeholder="000001"></div>
          <div class="field"><label class="label">CSC (token)</label><input class="input" placeholder="Gerado na SEFAZ"></div>
          <div class="field"><label class="label">Certificado A1 (.pfx)</label><input class="input" type="file"></div>
          <div class="field"><label class="label">Senha do certificado</label><input class="input" type="password"></div>
        </div>
      </fieldset>
    </section>`;
  el.querySelectorAll('[data-ck]').forEach(i => i.onchange = () => { S.fiscal.checklist[i.dataset.ck] = i.checked; save(); viewConfig(); });
}

function certHtml() {
  const c = S.fiscal.certificado; if (!c) return '';
  const d = diasCert();
  const tag = d > 30 ? `<span class="tag ok num">Válido · faltam ${d} dias</span>` : d > 0 ? `<span class="tag new num">Vence em ${d} dias · renovar</span>` : `<span class="tag bad">Vencido</span>`;
  return `<section class="panel pad sect">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h3 class="h3">Certificado digital</h3>${tag}</div>
    <div class="tbl-wrap"><table><tbody>
      <tr><td class="muted">Empresa</td><td><b>${esc(c.titular)}</b></td></tr>
      <tr><td class="muted">CNPJ</td><td class="num">${esc(c.cnpj)}</td></tr>
      <tr><td class="muted">Tipo</td><td>${esc(c.tipo)}</td></tr>
      <tr><td class="muted">Emitido por</td><td>${esc(c.emissor)}</td></tr>
      <tr><td class="muted">Validade</td><td class="num">${dataCurta(c.validoDe)} até <b>${dataCurta(c.validoAte)}</b></td></tr>
    </tbody></table></div>
    <p class="note" style="margin:0">O arquivo do certificado e a senha <b>não ficam neste protótipo</b>. No sistema de verdade eles ficam só no computador do caixa ou no serviço emissor da nota, protegidos. O sistema avisa no topo da tela 30 dias antes de vencer.</p>
  </section>`;
}

/* ---------- protótipo ---------- */
function cfgPrototipo(el) {
  el.innerHTML = `<section class="panel pad sect">
    <h1 class="title">Dados do protótipo</h1>
    <p style="margin:0">Tudo o que você lança aqui fica salvo só neste navegador, para testar à vontade. No sistema de verdade os dados ficam no computador do caixa, com cópia de segurança.</p>
    <p class="muted" style="margin:0">Para recomeçar com as comandas e produtos de exemplo:</p>
    <div><button class="btn danger" id="reset">Apagar tudo e voltar aos exemplos</button></div>
  </section>`;
  $('#reset').onclick = () => confirmar('Apagar tudo?', 'Todas as comandas, fechamentos, produtos e ajustes deste navegador serão apagados e os exemplos voltam.', 'Apagar e recomeçar', () => { S = migrar(seed()); ui.sel = null; ui.cx = null; save(); go('comandas'); toast('Exemplos restaurados'); }, true);
}

/* ---------- atalhos ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
  if (modalOpen()) return;
  if (e.key === 'F2') { e.preventDefault(); if (ui.tab !== 'comandas') go('comandas'); $('#newn') && $('#newn').focus(); }
  if (e.key === 'F3') { e.preventDefault(); if (ui.tab !== 'pesquisar') go('pesquisar'); else $('#q').select(); }
  if (e.key === 'F6') { e.preventDefault(); go('balanca'); }
  if (e.key === 'F4') { e.preventDefault(); if (ui.tab === 'balanca') { $('#bpeso').focus(); return; } if (ui.tab !== 'comandas') go('comandas'); $('#peso') ? $('#peso').focus() : toast('Abra ou selecione uma comanda primeiro'); }
  if (e.key === 'F8') { e.preventDefault(); if (ui.tab === 'caixa') { const c = abertas().find(x => x.id === ui.cx); if (c) abrirPagamento(c); return; } const c = selecionada(); if (ui.tab === 'comandas' && c && c.status === 'aberta') abrirPagamento(c); }
});
setInterval(() => { if (ui.tab === 'comandas' && !modalOpen() && !document.activeElement?.matches('input')) { const y = window.scrollY; viewComandas(); window.scrollTo(0, y); } }, 60000);

load(); render();
</script>
